name: Scheduled Database Auto-Updater

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows GitHub Actions to push the updated DB back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Database Updater
        run: |
          python db_updater.py --db football_data.db.gz

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes to commit (like the football_data.db.gz file)
          git status
          
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected! Committing and pushing updated database..."
            git add football_data.db.gz team_mappings.json
            git commit -m "⚙️ Automated daily database update [skip ci]"
            git push
          else
            echo "No new fixture changes detected today. Database is already up-to-date."
          fi
