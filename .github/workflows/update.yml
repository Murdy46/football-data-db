name: Scheduled Database Auto-Updater

on:
  schedule:
    - cron: '0 4 * * *'  # Runs automatically every day at 4 AM UTC
  workflow_dispatch:      # Allows you to trigger it manually from the "Actions" tab!

# Grant permissions to allow the workflow to push the updated database back to your repository
permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the files from your GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up a Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install pandas and requests so the script can run
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # Step 4: Run the updater script
      - name: Run database updater
        run: |
          python db_updater.py

      # Step 5: Automatically commit and push the updated football_data.db.gz back to GitHub
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add football_data.db.gz team_mappings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update football database with latest fixtures" && git push)
