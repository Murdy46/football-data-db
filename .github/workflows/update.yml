name: Scheduled Database Auto-Updater

on:
  schedule:
    - cron: '0 3 * * *'  # Runs automatically every day at 3:00 AM UTC
  workflow_dispatch:      # Allows you to trigger it manually anytime with a button

jobs:
  update-db:
    runs-on: ubuntu-latest
    
    # Give the action write permissions to push the updated database back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Decompress Database
        run: |
          if [ -f "football_data.db.gz" ]; then
            echo "Decompressing football_data.db.gz..."
            gunzip -f football_data.db.gz
          else
            echo "No compressed database found! Starting fresh..."
          fi

      - name: Run Database Updater
        run: |
          python db_updater.py --db football_data.db

      - name: Compress Database
        run: |
          echo "Compressing football_data.db..."
          gzip -9 -f football_data.db

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage both the gzipped database and any updated team mappings
          git add football_data.db.gz team_mappings.json
          
          # Only commit and push if there are actual new match records found
          if git diff --staged --quiet; then
            echo "No new results found. Database is already up to date!"
          else
            git commit -m "Automated weekly fixtures database update [skip ci]"
            git push origin main
          fi
